name: App iOS
on:
  push:
    paths:
      - "ios/**"
      - ".github/workflows/ios.yml"
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ios-${{ github.ref }}
  cancel-in-progress: true
env:
  BUNDLE_ID: ${{ vars.IOS_BUNDLE_ID || 'br.com.vivarium.app' }}

jobs:
  compilar:
    name: Compilar (sem assinatura)
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Escolher o Xcode mais novo
        run: |
          ls -d /Applications/Xcode*.app
          XC=$(ls -d /Applications/Xcode_*.app | sort -V | tail -1)
          sudo xcode-select -s "$XC"
          xcodebuild -version
      - name: Gerar o projeto Xcode
        working-directory: ios
        run: |
          brew install xcodegen
          xcodegen generate
      - name: Compilar para o simulador
        working-directory: ios
        run: |
          xcodebuild -project Vivarium.xcodeproj -scheme Vivarium \
            -configuration Debug -sdk iphonesimulator \
            -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath build PRODUCT_BUNDLE_IDENTIFIER="$BUNDLE_ID" \
            CODE_SIGNING_ALLOWED=NO build
      - name: Guardar o app de simulador
        run: cd ios/build/Build/Products/Debug-iphonesimulator && zip -qr "$GITHUB_WORKSPACE/Vivarium-simulador.zip" Vivarium.app
      - uses: actions/upload-artifact@v4
        with:
          name: Vivarium-simulador
          path: Vivarium-simulador.zip

  testflight:
    name: Enviar para o TestFlight
    needs: compilar
    if: github.ref == 'refs/heads/main'
    runs-on: macos-15
    env:
      TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
      ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
      ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
      ASC_KEY_P8: ${{ secrets.ASC_KEY_P8 }}
    steps:
      - name: Conferir segredos
        id: segredos
        run: |
          if [ -z "$TEAM_ID" ] || [ -z "$ASC_KEY_ID" ] || [ -z "$ASC_ISSUER_ID" ] || [ -z "$ASC_KEY_P8" ]; then
            echo "::notice::Faltam os segredos da Apple (APPLE_TEAM_ID, ASC_KEY_ID, ASC_ISSUER_ID, ASC_KEY_P8). Envio ao TestFlight pulado."
            echo "ok=false" >> "$GITHUB_OUTPUT"
          else
            echo "ok=true" >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/checkout@v4
        if: steps.segredos.outputs.ok == 'true'
      - name: Preparar Xcode, projeto e chave
        if: steps.segredos.outputs.ok == 'true'
        run: |
          XC=$(ls -d /Applications/Xcode_*.app | sort -V | tail -1)
          sudo xcode-select -s "$XC"
          xcodebuild -version
          brew install xcodegen
          (cd ios && xcodegen generate)
          mkdir -p "$RUNNER_TEMP/chave"
          printf '%s\n' "$ASC_KEY_P8" > "$RUNNER_TEMP/chave/AuthKey_$ASC_KEY_ID.p8"
      - name: Arquivar (assinatura automática pela nuvem da Apple)
        if: steps.segredos.outputs.ok == 'true'
        working-directory: ios
        run: |
          xcodebuild -project Vivarium.xcodeproj -scheme Vivarium \
            -configuration Release -destination 'generic/platform=iOS' \
            -archivePath "$RUNNER_TEMP/Vivarium.xcarchive" \
            DEVELOPMENT_TEAM="$TEAM_ID" CODE_SIGN_STYLE=Automatic \
            PRODUCT_BUNDLE_IDENTIFIER="$BUNDLE_ID" \
            CURRENT_PROJECT_VERSION="${{ github.run_number }}" \
            -allowProvisioningUpdates \
            -authenticationKeyPath "$RUNNER_TEMP/chave/AuthKey_$ASC_KEY_ID.p8" \
            -authenticationKeyID "$ASC_KEY_ID" \
            -authenticationKeyIssuerID "$ASC_ISSUER_ID" \
            archive
      - name: Exportar e enviar ao App Store Connect
        if: steps.segredos.outputs.ok == 'true'
        working-directory: ios
        run: |
          cat > "$RUNNER_TEMP/ExportOptions.plist" <<PLIST
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0"><dict>
            <key>method</key><string>app-store-connect</string>
            <key>destination</key><string>upload</string>
            <key>teamID</key><string>$TEAM_ID</string>
            <key>signingStyle</key><string>automatic</string>
            <key>manageAppVersionAndBuildNumber</key><false/>
            <key>testFlightInternalTestingOnly</key><true/>
          </dict></plist>
          PLIST
          xcodebuild -exportArchive \
            -archivePath "$RUNNER_TEMP/Vivarium.xcarchive" \
            -exportOptionsPlist "$RUNNER_TEMP/ExportOptions.plist" \
            -exportPath "$RUNNER_TEMP/export" \
            -allowProvisioningUpdates \
            -authenticationKeyPath "$RUNNER_TEMP/chave/AuthKey_$ASC_KEY_ID.p8" \
            -authenticationKeyID "$ASC_KEY_ID" \
            -authenticationKeyIssuerID "$ASC_ISSUER_ID"
          echo "Build ${{ github.run_number }} enviado. Em 5 a 15 minutos ele aparece no TestFlight." >> "$GITHUB_STEP_SUMMARY"
      - name: Apagar a chave
        if: always()
        run: rm -rf "$RUNNER_TEMP/chave"
